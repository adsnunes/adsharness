[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsharness"
version = "0.2.0"
description = "Local MCP, skills and harness manager for Codex and Antigravity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "adsharness contributors"}]
dependencies = []

[project.scripts]
adsharness = "adsharness.server:main"

[tool.setuptools.packages.find]
include = ["adsharness*"]

[tool.setuptools.package-data]
adsharness = ["static/*"]
